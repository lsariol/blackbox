# Local development on Docker Desktop. Lighthouse never reads this file.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# The ${...} values come from .env (copy .env.example).

services:
  blackbox-proxy:
    environment:
      - APP_ENV=dev

  blackbox-collector:
    environment:
      - APP_ENV=dev

  blackbox-api:
    environment:
      - APP_ENV=dev
      - TZ=${TZ:-UTC}                      # Docker Desktop's VM runs on UTC
    ports:
      - "127.0.0.1:2601:2600"
